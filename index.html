<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trafy – Learn AI from the Experts</title>
  <meta name="description" content="Connect with Trafy – your gateway to AI micro-learning, podcasts, and expert community." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #111111;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Logo Card */
    .logo-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #C6FF33;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-card span {
      font-size: clamp(48px, 14vw, 72px);
      font-weight: 900;
      color: #111111;
      letter-spacing: -1px;
    }

    /* Social Section */
    .social-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .social-label {
      color: #E6FFA4;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .social-icons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-icons a {
      color: #ffffff;
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .social-icons a:hover { opacity: 0.6; }

    /* Link Buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background-color: #F0F0DC;
      border-radius: 18px;
      text-decoration: none;
      color: #111111;
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 500;
      transition: filter 0.15s, transform 0.15s;
    }

    .link-btn:hover { filter: brightness(0.95); }
    .link-btn:active { transform: scale(0.98); }

    .link-btn svg { flex-shrink: 0; }

    /* Footer */
    footer {
      color: rgba(255,255,255,0.25);
      font-size: 13px;
      text-align: center;
      padding-bottom: 8px;
    }

    /* Responsive tweaks */
    @media (max-width: 360px) {
      body { padding: 28px 16px; }
      .container { gap: 24px; }
      .link-btn { padding: 15px 16px; gap: 12px; }
    }

    @media (min-width: 500px) {
      .logo-card { max-height: 390px; aspect-ratio: unset; height: 55vw; max-height: 340px; }
    }
  </style>
</head>
<body>

    <!-- Logo Card -->
    <div class="logo-card" font-family: "Poppins",; 
  font-weight: 600; >

  </div>
</body>
</html>
